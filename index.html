<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hablar con GAIA — ASCENDIS</title>
<meta name="robots" content="noindex" />
<style>
  :root { --navy:#0F3E69; --cyan:#1DB5C4; --bg:#F4F7F9; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    display:grid; place-items:center; padding:24px;
    background:linear-gradient(150deg,#0B1730 0%,#12325A 55%,#0F3E69 100%);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    color:#fff; text-align:center;
  }
  .caja { max-width:420px; }
  h1 { margin:0 0 10px; font-size:clamp(22px,5vw,30px); font-weight:800; letter-spacing:-.02em; }
  p  { margin:0 0 26px; font-size:15px; line-height:1.6; color:rgba(255,255,255,.82); }
  .punto {
    width:74px; height:74px; margin:0 auto 22px; border-radius:50%;
    border:3px solid var(--cyan); background:rgba(255,255,255,.08);
    display:grid; place-items:center;
    animation:latir 1.6s ease-in-out infinite;
  }
  .punto svg { width:34px; height:34px; color:var(--cyan); }
  @keyframes latir {
    0%,100% { box-shadow:0 0 0 0 rgba(29,181,196,.45); }
    50%     { box-shadow:0 0 0 16px rgba(29,181,196,0); }
  }
  button {
    display:inline-flex; align-items:center; gap:9px;
    height:48px; padding:0 26px; border:0; border-radius:11px;
    background:var(--cyan); color:#fff; font-size:15px; font-weight:700;
    cursor:pointer; box-shadow:0 8px 22px rgba(29,181,196,.35);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  button:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(29,181,196,.45); }
  .aviso { margin-top:20px; font-size:12.5px; color:rgba(255,255,255,.55); min-height:18px; }
</style>
</head>
<body>

  <div class="caja">
    <div class="punto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 10h8M8 14h5M4 19V6a2 2 0 012-2h12a2 2 0 012 2v9a2 2 0 01-2 2H8l-4 4z"/>
      </svg>
    </div>

    <h1>Hablar con GAIA</h1>
    <p>Estamos abriendo el chat. Si no aparece en unos segundos, toca el botón.</p>

    <button type="button" id="abrir">Abrir el chat</button>
    <div class="aviso" id="aviso"></div>
  </div>

<!-- Start of ascendis Zendesk Widget script -->
<script id="ze-snippet" src="https://static.zdassets.com/ekr/snippet.js?key=c60b16af-3696-4bb7-854d-cd1f982cea2e"></script>
<!-- End of ascendis Zendesk Widget script -->

<script>
(function () {
  var aviso = document.getElementById("aviso");
  var boton = document.getElementById("abrir");

  function abrir() {
    if (!window.zE) return false;
    try { window.zE("messenger", "open"); return true; }
    catch (e1) {
      try { window.zE("webWidget", "open"); return true; } catch (e2) { return false; }
    }
  }

  // El widget carga despues que la pagina: se reintenta hasta 15 segundos.
  var intentos = 0;
  var reloj = setInterval(function () {
    if (abrir()) { clearInterval(reloj); aviso.textContent = ""; return; }
    if (++intentos > 50) {
      clearInterval(reloj);
      aviso.textContent = "El chat tardó en cargar. Usa el botón de arriba.";
    }
  }, 300);

  boton.addEventListener("click", function () {
    if (!abrir()) aviso.textContent = "El chat aún está cargando, intenta de nuevo en un momento.";
  });

  // Si el usuario cierra el chat, se ofrece volver a abrirlo en vez de dejar la pagina muerta.
  function suscribir() {
    if (!window.zE) return false;
    try {
      window.zE("messenger:on", "close", function () {
        aviso.textContent = "Cerraste el chat. Toca el botón para volver a abrirlo.";
      });
      return true;
    } catch (e) { return false; }
  }
  var n = 0, reloj2 = setInterval(function () {
    if (suscribir() || ++n > 50) clearInterval(reloj2);
  }, 300);
})();
</script>

</body>
</html>
